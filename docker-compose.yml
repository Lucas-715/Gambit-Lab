version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: gambit-lab-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - STORAGE_DIR=/app/data/storage
      - DATABASE_URL=sqlite:////app/data/gambit_lab.db
    volumes:
      - gambit_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: gambit-lab-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gambit_data:
